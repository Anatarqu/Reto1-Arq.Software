services:
  queue-broker:
    image: rabbitmq:3-management
    container_name: queue-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build: ./api_gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    depends_on:
      queue-broker:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: queue-broker
      ORDER_QUEUE: orders_buffer
      ORDER_QUEUE_MAX_LENGTH: "500000"

  matching-engine:
    build: ./matching_engine
    container_name: matching-engine
    depends_on:
      queue-broker:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: queue-broker
      ORDER_QUEUE: orders_buffer
      PREFETCH_COUNT: "200"
      CONFIRMATION_EXCHANGE: trade_events
      CONFIRMATION_QUEUE: trade_confirmations
      CONFIRMATION_ROUTING_KEY: trade.confirmation
      CONFIRMATION_BUFFER_SIZE: "100000"

  redis-idempotency:
    image: redis:7-alpine
    container_name: redis-idempotency
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  confirmation-dispatcher:
    build: ./confirmation_dispatcher
    container_name: confirmation-dispatcher
    ports:
      - "8090:8090"
    depends_on:
      queue-broker:
        condition: service_healthy
      redis-idempotency:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: queue-broker
      CONFIRMATION_EXCHANGE: trade_events
      CONFIRMATION_QUEUE: trade_confirmations
      CONFIRMATION_ROUTING_KEY: trade.confirmation
      REDIS_HOST: redis-idempotency
      REDIS_PORT: "6379"
      IDEMPOTENCY_TTL_SECONDS: "300"
      L1_CACHE_SIZE: "50000"
      L1_CACHE_TTL_SECONDS: "120"

  injector:
    build: ./injector
    container_name: injector
    ports:
      - "8089:8089"
    depends_on:
      api-gateway:
        condition: service_started
    environment:
      TARGET_URL: http://api-gateway:8000

  latency-probe:
    build: ./latency_probe
    container_name: latency-probe
    profiles: ["test"]
    depends_on:
      confirmation-dispatcher:
        condition: service_started
    volumes:
      - ./results:/app/results
    environment:
      PROBE_HOST: confirmation-dispatcher
      PROBE_PORT: "8090"
      PROBE_TRADERS: "1000"
      PROBE_DURATION: "2400"
      PROBE_FASE1_DURATION: "600"
